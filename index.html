
<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sahayak - Admin Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 15px; }
        .container { max-width: 600px; margin: 0 auto; background: #ffffff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #006A4E; text-align: center; margin-bottom: 5px; font-size: 24px; }
        p.subtitle { text-align: center; color: #666; margin-top: 0; font-size: 14px; }
        .card { border: 1px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-bottom: 20px; background: #fafafa; }
        .card h2 { color: #F42A41; font-size: 18px; margin-top: 0; border-bottom: 2px solid #F42A41; padding-bottom: 5px; }
        label { display: block; margin-top: 10px; font-weight: bold; font-size: 14px; color: #333; }
        input, select, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; background-color: #006A4E; color: white; border: none; padding: 12px; margin-top: 15px; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #00503a; }
        .alert { padding: 10px; margin-top: 10px; border-radius: 6px; font-size: 14px; display: none; text-align: center; }
        .alert-success { background-color: #d4edda; color: #155724; }
        .alert-error { background-color: #f8d7da; color: #721c24; }
    </style>

    <!-- Firebase Compat SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="container">
    <h1>সহায়ক (Sahayak) - এডমিন প্যানেল</h1>
    <p class="subtitle">লালপুর উপজেলার ডাটা এন্ট্রি সেন্টার</p>

    <!-- Alert Box -->
    <div id="alertBox" class="alert"></div>

    <!-- Section 1: News Update -->
    <div class="card">
        <h2>১. জরুরি সংবাদ/নোটিশ আপডেট</h2>
        <label for="newsInput">সর্বশেষ খবর / ঘোষণা:</label>
        <textarea id="newsInput" rows="3" placeholder="যেমন: লালপুর হাসপাতালে আগামী কাল ফ্রি মেডিকেল ক্যাম্প..."></textarea>
        <button onclick="updateNews()">সংবাদ আপডেট করুন</button>
    </div>

    <!-- Section 2: Contact Entry -->
    <div class="card">
        <h2>২. নতুন কন্টাক্ট তথ্য যোগ করুন</h2>
        
        <label for="category">ক্যাটাগরি সিলেক্ট করুন:</label>
        <select id="category">
            <option value="doctor">ডাক্তার ও হাসপাতাল (Doctor)</option>
            <option value="mechanic">মেকানিক ও গ্যারেজ (Mechanic)</option>
            <option value="fuel">তেল পাম্প ও পেট্রোল (Fuel/Gas)</option>
            <option value="emergency">জরুরি সেবা (Police/Fire/Ambulance)</option>
            <option value="other">অন্যান্য (Other Services)</option>
        </select>

        <label for="name">ব্যক্তি / প্রতিষ্ঠানের নাম:</label>
        <input type="text" id="name" placeholder="যেমন: ডাঃ রফিকুল ইসলাম">

        <label for="title">পদবি / বিবরণ:</label>
        <input type="text" id="title" placeholder="যেমন: মেডিসিন বিশেষজ্ঞ">

        <label for="phone">মোবাইল নম্বর:</label>
        <input type="text" id="phone" placeholder="যেমন: 01711XXXXXX">

        <label for="location">ঠিকানা / এলাকা:</label>
        <input type="text" id="location" placeholder="যেমন: লালপুর বাজার">

        <button onclick="addContact()">কন্টাক্ট সেভ করুন</button>
    </div>
</div>

<script>
    // 🔑 আপনার ফায়ারবেস ওয়েব কনফিগারেশন কী গুলো এখানে বসাবেন:
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "sohayok-cbd50.firebaseapp.com",
        databaseURL: "https://sohayok-cbd50-default-rtdb.firebaseio.com",
        projectId: "sohayok-cbd50",
        storageBucket: "sohayok-cbd50.appspot.com",
        messagingSenderId: "362613541781",
        appId: "YOUR_WEB_APP_ID"
    };

    // Firebase Initialize
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    function showAlert(msg, isSuccess) {
        const alertBox = document.getElementById('alertBox');
        alertBox.innerText = msg;
        alertBox.className = 'alert ' + (isSuccess ? 'alert-success' : 'alert-error');
        alertBox.style.display = 'block';
        setTimeout(() => { alertBox.style.display = 'none'; }, 4000);
    }

    // Update News Function
    function updateNews() {
        const news = document.getElementById('newsInput').value;
        if (!news.trim()) {
            showAlert("মেহেরবানি করে সংবাদের তথ্য লিখুন!", false);
            return;
        }
        database.ref('news_update').set(news)
            .then(() => {
                showAlert("সংবাদ সফলভাবে আপডেট হয়েছে!", true);
                document.getElementById('newsInput').value = '';
            })
            .catch((err) => {
                showAlert("ত্রুটি: " + err.message, false);
            });
    }

    // Add Contact Function
    function addContact() {
        const category = document.getElementById('category').value;
        const name = document.getElementById('name').value;
        const title = document.getElementById('title').value;
        const phone = document.getElementById('phone').value;
        const location = document.getElementById('location').value;

        if (!name.trim() || !phone.trim()) {
            showAlert("নাম এবং মোবাইল নম্বর অবশ্যই দিতে হবে!", false);
            return;
        }

        const newContactRef = database.ref('contacts').push();
        newContactRef.set({
            id: newContactRef.key,
            category: category,
            name: name,
            title: title,
            phone: phone,
            location: location
        })
        .then(() => {
            showAlert("কন্টাক্ট সফলভাবে সেভ হয়েছে!", true);
            document.getElementById('name').value = '';
            document.getElementById('title').value = '';
            document.getElementById('phone').value = '';
            document.getElementById('location').value = '';
        })
        .catch((err) => {
            showAlert("ত্রুটি: " + err.message, false);
        });
    }
</script>

</body>
</html>
