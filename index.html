<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>সহায়ক - লালপুর এডমিন প্যানেল</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f0f2f5; margin: 0; padding: 12px; color: #333; }
        .container { max-width: 650px; margin: 0 auto; }
        .header { background: #006A4E; color: white; text-align: center; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        .header h1 { margin: 0; font-size: 22px; }
        .header p { margin: 5px 0 0 0; font-size: 13px; opacity: 0.9; }
        
        .card { background: white; border-radius: 10px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
        .card h2 { color: #F42A41; margin-top: 0; font-size: 16px; border-bottom: 2px solid #F42A41; padding-bottom: 6px; }
        
        label { display: block; font-weight: bold; margin-top: 10px; font-size: 13px; }
        input, select, textarea { width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        
        button { background: #006A4E; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 15px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 12px; }
        button:hover { background-color: #00523d; }
        button.btn-danger { background: #dc3545; }
        button.btn-warning { background: #ffc107; color: #000; }
        button.btn-cancel { background: #6c757d; margin-top: 6px; }

        .alert { padding: 12px; border-radius: 6px; font-weight: bold; margin-bottom: 15px; display: none; text-align: center; font-size: 14px; }
        .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

        .item-card { background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 8px; padding: 12px; margin-top: 10px; }
        .item-card h4 { margin: 0 0 5px 0; color: #006A4E; font-size: 16px; }
        .item-card p { margin: 3px 0; font-size: 13px; color: #555; }
        .btn-group { display: flex; gap: 8px; margin-top: 8px; }
        .btn-group button { width: 50%; padding: 8px; font-size: 12px; margin-top: 0; }
        .badge { display: inline-block; background: #e8f5e9; color: #2e7d32; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; margin-bottom: 4px; }
    </style>

    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>সহায়ক (Sahayak) - এডমিন ড্যাশবোর্ড</h1>
        <p>লালপুর উপজেলা জরুরি তথ্য ও নিউজ প্যানেল</p>
    </div>

    <!-- Alert Box -->
    <div id="alertBox" class="alert"></div>

    <!-- Section 1: News Update -->
    <div class="card">
        <h2>১. এলাকার সংবাদ / জরুরি নোটিশ আপডেট</h2>
        <label for="newsInput">বর্তমান খবর:</label>
        <textarea id="newsInput" rows="3" placeholder="যেমন: আগামী কাল লালপুরে বিদ্যুৎ সরবরাহ বন্ধ থাকবে..."></textarea>
        <button onclick="updateNews()">সংবাদ পাবলিশ করুন</button>
    </div>

    <!-- Section 2: Contact Form -->
    <div class="card">
        <h2 id="formTitle">২. নতুন কন্টাক্ট যোগ করুন</h2>
        <input type="hidden" id="editKey">
        
        <label for="category">ক্যাটাগরি:</label>
        <select id="category">
            <option value="doctor">ডাক্তার ও হাসপাতাল</option>
            <option value="mechanic">মেকানিক ও গ্যারেজ</option>
            <option value="fuel">তেল পাম্প ও পেট্রোল</option>
            <option value="emergency">জরুরি সেবা (পুলিশ/ফায়ার/এ্যাম্বুলেন্স)</option>
            <option value="other">অন্যান্য সেবা</option>
        </select>

        <label for="name">ব্যক্তি / প্রতিষ্ঠানের নাম (*):</label>
        <input type="text" id="name" placeholder="যেমন: ডাঃ রফিকুল ইসলাম">

        <label for="title">পদবি / বিবরণ:</label>
        <input type="text" id="title" placeholder="যেমন: শিশু ও মেডিসিন বিশেষজ্ঞ">

        <label for="phone">মোবাইল নম্বর (*):</label>
        <input type="text" id="phone" placeholder="যেমন: 01711XXXXXX">

        <label for="location">ঠিকানা / এলাকা:</label>
        <input type="text" id="location" placeholder="যেমন: লালপুর বাজার">

        <button id="saveBtn" onclick="saveContact()">কন্টাক্ট সেভ করুন</button>
        <button id="cancelBtn" class="btn-cancel" onclick="resetForm()" style="display:none;">ক্যানসেল করুন</button>
    </div>

    <!-- Section 3: Contact List -->
    <div class="card">
        <h2>৩. সেভ করা সকল কন্টাক্ট তালিকা</h2>
        <div id="contactsContainer">
            <p style="text-align: center; color: #777;">ডাটা লোড হচ্ছে...</p>
        </div>
    </div>
</div>

<script>
    // 🔑 আপনার দেওয়া ফায়ারবেস ওয়েব কনফিগারেশন + ডাটাবেজ ইউআরএল
    const firebaseConfig = {
        apiKey: "AIzaSyDU1pxKC9sWm9BV-2HUY7646qvkPrwLXvY",
        authDomain: "sohayok-cbd50.firebaseapp.com",
        databaseURL: "https://sohayok-cbd50-default-rtdb.firebaseio.com",
        projectId: "sohayok-cbd50",
        storageBucket: "sohayok-cbd50.firebasestorage.app",
        messagingSenderId: "362613541781",
        appId: "1:362613541781:web:a5fd8e11ec8554056d449c",
        measurementId: "G-686DJLJYMQ"
    };

    // Firebase Initialize
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // Alert Message Function
    function showAlert(msg, isSuccess) {
        const alertBox = document.getElementById('alertBox');
        alertBox.innerText = msg;
        alertBox.className = 'alert ' + (isSuccess ? 'alert-success' : 'alert-error');
        alertBox.style.display = 'block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
        setTimeout(() => { alertBox.style.display = 'none'; }, 4000);
    }

    // 1. Update News Logic
    function updateNews() {
        const news = document.getElementById('newsInput').value;
        if (!news.trim()) {
            showAlert("মেহেরবানি করে সংবাদের তথ্য লিখুন!", false);
            return;
        }
        database.ref('news_update').set(news)
            .then(() => showAlert("সংবাদ সফলভাবে আপডেট হয়েছে!", true))
            .catch((err) => showAlert("ত্রুটি: " + err.message, false));
    }

    // Fetch News on Page Load
    database.ref('news_update').on('value', (snapshot) => {
        if (snapshot.exists()) {
            document.getElementById('newsInput').value = snapshot.val();
        }
    });

    // 2. Add / Edit Contact Logic
    function saveContact() {
        const editKey = document.getElementById('editKey').value;
        const category = document.getElementById('category').value;
        const name = document.getElementById('name').value;
        const title = document.getElementById('title').value;
        const phone = document.getElementById('phone').value;
        const location = document.getElementById('location').value;

        if (!name.trim() || !phone.trim()) {
            showAlert("নাম এবং নম্বর অবশ্যই দিতে হবে!", false);
            return;
        }

        const data = { category, name, title, phone, location };

        if (editKey) {
            // Update Existing Contact
            database.ref('contacts/' + editKey).update(data)
                .then(() => {
                    showAlert("কন্টাক্ট সফলভাবে আপডেট হয়েছে!", true);
                    resetForm();
                })
                .catch((err) => showAlert("ত্রুটি: " + err.message, false));
        } else {
            // Push New Contact
            const newRef = database.ref('contacts').push();
            data.id = newRef.key;
            newRef.set(data)
                .then(() => {
                    showAlert("নতুন কন্টাক্ট সফলভাবে সেভ হয়েছে!", true);
                    resetForm();
                })
                .catch((err) => showAlert("ত্রুটি: " + err.message, false));
        }
    }

    // 3. Listen and Render Contacts List
    database.ref('contacts').on('value', (snapshot) => {
        const container = document.getElementById('contactsContainer');
        container.innerHTML = '';

        if (!snapshot.exists()) {
            container.innerHTML = '<p style="text-align: center; color: #777;">এখনো কোনো কন্টাক্ট ডাটাবেজে যোগ করা হয়নি।</p>';
            return;
        }

        snapshot.forEach((childSnapshot) => {
            const key = childSnapshot.key;
            const item = childSnapshot.val();

            const card = document.createElement('div');
            card.className = 'item-card';

            card.innerHTML = `
                <span class="badge">${getCategoryName(item.category)}</span>
                <h4>${escapeHtml(item.name)}</h4>
                <p><strong>বিবরণ:</strong> ${escapeHtml(item.title || 'N/A')}</p>
                <p><strong>মোবাইল:</strong> ${escapeHtml(item.phone)}</p>
                <p><strong>ঠিকানা:</strong> ${escapeHtml(item.location || 'N/A')}</p>
                <div class="btn-group">
                    <button class="btn-warning" onclick="editContact('${key}', '${escapeJs(item.category)}', '${escapeJs(item.name)}', '${escapeJs(item.title)}', '${escapeJs(item.phone)}', '${escapeJs(item.location)}')">এডিট</button>
                    <button class="btn-danger" onclick="deleteContact('${key}')">মুছে ফেলুন</button>
                </div>
            `;
            container.appendChild(card);
        });
    });

    // Populate Form for Edit
    function editContact(key, category, name, title, phone, location) {
        document.getElementById('editKey').value = key;
        document.getElementById('category').value = category;
        document.getElementById('name').value = name;
        document.getElementById('title').value = title;
        document.getElementById('phone').value = phone;
        document.getElementById('location').value = location;

        document.getElementById('formTitle').innerText = "কন্টাক্ট এডিট করুন";
        document.getElementById('saveBtn').innerText = "আপডেট করুন";
        document.getElementById('cancelBtn').style.display = "block";
        window.scrollTo({ top: 200, behavior: 'smooth' });
    }

    // Reset Form
    function resetForm() {
        document.getElementById('editKey').value = '';
        document.getElementById('name').value = '';
        document.getElementById('title').value = '';
        document.getElementById('phone').value = '';
        document.getElementById('location').value = '';

        document.getElementById('formTitle').innerText = "২. নতুন কন্টাক্ট যোগ করুন";
        document.getElementById('saveBtn').innerText = "কন্টাক্ট সেভ করুন";
        document.getElementById('cancelBtn').style.display = "none";
    }

    // Delete Contact
    function deleteContact(key) {
        if (confirm("আপনি কি নিশ্চিত যে এই কন্টাক্টটি মুছে ফেলতে চান?")) {
            database.ref('contacts/' + key).remove()
                .then(() => showAlert("কন্টাক্ট সফলভাবে মুছে ফেলা হয়েছে!", true))
                .catch((err) => showAlert("ত্রুটি: " + err.message, false));
        }
    }

    // Helper Category Name
    function getCategoryName(cat) {
        const categories = {
            'doctor': 'ডাক্তার ও হাসপাতাল',
            'mechanic': 'মেকানিক ও গ্যারেজ',
            'fuel': 'তেল পাম্প ও পেট্রোল',
            'emergency': 'জরুরি সেবা',
            'other': 'অন্যান্য'
        };
        return categories[cat] || cat;
    }

    function escapeHtml(str) {
        return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
    function escapeJs(str) {
        return (str || '').replace(/'/g, "\\'").replace(/"/g, '\\"');
    }
</script>

</body>
</html>
